# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Static check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/bun-setup

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck
  
  test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/bun-setup

      - name: Test
        run: bun test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check, test]

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/bun-setup

      - name: Build all packages
        run: bun run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - app: backend
          - app: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Build ${{ matrix.app }} image
        run: docker build -f apps/${{ matrix.app }}/Dockerfile -t ${{ matrix.app }}:${{ github.sha }} .