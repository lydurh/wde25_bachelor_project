# .github/workflows/ci.yml
name: CI

on:
  workflow_call:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Static check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/bun-setup

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck
  
  test:
    name: Unit Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      POSTGRES_HOST: localhost
      JWT_SECRET: ci-test-secret-do-not-use-in-production-32chars
      GOOGLE_MAPS_API_KEY: ci-test-google-maps-key

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/bun-setup

      - name: Push schema to test DB
        run: cd packages/db && bunx drizzle-kit push

      - name: Test
        run: bun test

  audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/bun-setup

      - name: Dependency audit (bun)
        continue-on-error: true
        run: bun audit --audit-level=high

  docker:
    name: Docker Prod Build Validate
    runs-on: ubuntu-latest
    needs: [check, test]
    strategy:
      matrix:
        include:
          - app: backend
          - app: frontend

    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} prod image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile.prod
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}