name: CD

on:
  push:
    branches: [main]

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - app: backend
            dockerfile: apps/backend/Dockerfile.prod
          - app: frontend
            dockerfile: apps/frontend/Dockerfile.prod

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
            
  deploy:
    name: Trigger Dokploy Deploy
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Trigger Dokploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL }}
          BRANCH_NAME: ${{ github.ref_name }}
          BRANCH_REF: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          test -n "$WEBHOOK_URL"
          http_code=$(curl --show-error --silent -o /tmp/resp.txt -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: ${{ github.run_id }}-${{ github.run_attempt }}" \
            --data "{\"ref\":\"$BRANCH_REF\",\"after\":\"$COMMIT_SHA\",\"repository\":{\"default_branch\":\"$BRANCH_NAME\"}}")
          echo "HTTP $http_code"
          echo "Body:"
          cat /tmp/resp.txt
          echo
          if [ "$http_code" -ge 400 ]; then
            echo "Dokploy returned error status"
            exit 1
          fi
          if grep -qi 'not match\|error' /tmp/resp.txt; then
            echo "Dokploy rejected deploy"
            exit 1
          fi