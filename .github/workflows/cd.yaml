name: CD

on:
  push:
    branches: [main]

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - app: backend
            dockerfile: apps/backend/Dockerfile.prod
          - app: frontend
            dockerfile: apps/frontend/Dockerfile.prod

    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.app == 'frontend' && format('VITE_GOOGLE_MAPS_API_KEY={0}', secrets.VITE_GOOGLE_MAPS_API_KEY) || '' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Scan pushed image (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.app }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
  deploy:
    name: Trigger Dokploy Deploy
    runs-on: ubuntu-latest
    needs: build-and-push

    strategy:
      matrix:
        include:
          - app: backend
            webhook_secret: DOKPLOY_BACKEND_WEBHOOK_URL
          - app: frontend
            webhook_secret: DOKPLOY_FRONTEND_WEBHOOK_URL

    steps:
      - name: Trigger Dokploy webhook (${{ matrix.app }})
        env:
          WEBHOOK_URL: ${{ secrets[matrix.webhook_secret] }}
          BRANCH_NAME: ${{ github.ref_name }}
          BRANCH_REF: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          test -n "$WEBHOOK_URL"
          http_code=$(curl --show-error --silent -o /tmp/resp.txt -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.app }}" \
            --data "{\"ref\":\"$BRANCH_REF\",\"after\":\"$COMMIT_SHA\",\"repository\":{\"default_branch\":\"$BRANCH_NAME\"}}")
          echo "HTTP $http_code"
          echo "Body:"
          cat /tmp/resp.txt
          echo
          if [ "$http_code" -ge 400 ]; then
            echo "Dokploy returned error status"
            exit 1
          fi
          if grep -qi 'not match\|error' /tmp/resp.txt; then
            echo "Dokploy rejected deploy"
            exit 1
          fi