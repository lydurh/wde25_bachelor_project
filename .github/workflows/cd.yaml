name: CD

on:
  push:
    branches: [main]

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - app: backend
            dockerfile: apps/backend/Dockerfile.prod
          - app: frontend
            dockerfile: apps/frontend/Dockerfile.prod

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
            
  deploy:
    name: Trigger Dokploy Deploy
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Trigger Dokploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL }}
          BRANCH_NAME: ${{ github.ref_name }}
          BRANCH_REF: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          test -n "$WEBHOOK_URL"
          response=$(curl --fail-with-body --show-error --silent \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data "{\"branch\":\"$BRANCH_NAME\",\"ref\":\"$BRANCH_REF\",\"sha\":\"$COMMIT_SHA\"}")
          echo "Dokploy response: $response"
          if echo "$response" | grep -qi 'not match\|error'; then
            echo "Dokploy rejected deploy"
            exit 1
          fi