name: "Setup Bun"
description: "Checkout, install Bun, cache, and install dependencies"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.13"

    - uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}

    - run: bun install
      shell: bash
